# Continuous integration for W#, on GitHub-hosted runners.
#
# The counterpart to `.forgejo/workflows/ci.yml`, which does the same on the
# self-hosted runners this repository push-mirrors from. Forgejo Actions is
# disabled for the repository, so this is what actually runs; the Forgejo file
# is left in place for when those runners come back.
#
# The platform matrix runs on the host. The Forgejo jobs run in a digest-pinned
# image from a private registry, because Forgejo runs `actions/checkout` with `node`
# *inside* the job's container and the stock Rust image has none. GitHub's
# runners have node, rustup and a C compiler already, and `rust-toolchain.toml`
# pins 1.95.0 so the toolchain honours itself on first use.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A backtrace costs nothing until something panics, and when something does
  # panic in CI the log is all there is to debug from.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Exercise every release platform before tagging. Platform-specific
      # failures must not cancel the remaining jobs.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: cc
          - os: macos-latest
            cc: cc
          - os: macos-15-intel
            cc: cc
          - os: windows-latest
            # Not `cc`: `link.rs` passes `-o`, which `cl.exe` does not
            # understand. The hosted image ships clang, which drives `link.exe`
            # underneath and does understand it.
            cc: clang
    defaults:
      run:
        # Git Bash on Windows, so one script works on all four. Every `run:` below
        # is written for it.
        shell: bash
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore cargo and target caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # `target` holds artifacts built with one profile by one toolchain;
          # keying on the job *and the platform* as well as the lockfile keeps
          # `test` and `lint` from overwriting each other's cache, and keeps two
          # operating systems from restoring each other's object files.
          key: cargo-test-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-test-${{ matrix.os }}-

      # **Git Bash ships a coreutils `link`, and it comes before MSVC's on
      # `PATH`.** `clang` drives the link by running `link.exe`, so it finds the
      # one that makes hard links instead, which fails talking about operands
      # rather than about linking. Nothing here uses `link(1)`, so the shortest
      # fix is to take it away.
      - name: Remove the link.exe that is not a linker
        if: runner.os == 'Windows'
        run: rm -f "/c/Program Files/Git/usr/bin/link.exe"

      # clang finds the MSVC toolchain by itself and the Windows SDK's
      # *libraries* not at all: `LIB` and `INCLUDE` are what `vcvars64.bat`
      # exports, and without them the case suite's AOT pass cannot resolve
      # `kernel32` and the seven others `link.rs` names.
      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Versions
        run: |
          rustc --version
          cargo --version
          "$CC" --version | head -1

      # **Before the tests, and that order is load-bearing.** The case suite's
      # AOT pass shells out to `wsharp build`, which links against
      # `libwsharp_start.a` found beside the binary -- but `cargo test` does not
      # build `crates/wsharp-start` at all, because it declares `test = false`
      # and nothing depends on it. Without this step a cold cache has no
      # archive and every built case fails; a warm one links whatever an
      # earlier commit left behind, which is worse, because it passes.
      - name: Build for the test suite
        run: cargo build --workspace --locked

      # Runs the end-to-end case suite twice -- once normally and once under
      # `--gc-stress`, which collects at every allocation and checks every root
      # the stack maps describe. That second pass is the collector's main
      # defence, so it is the reason CI runs the whole workspace rather than
      # only the unit tests.
      - name: Test
        run: cargo test --workspace --locked

  # The adversarial harness's own verdict logic, on every push and every pull
  # request. It needs no cargo, no `cc` and no W# compiler -- it drives
  # `parity.sh` over a stub compiler whose answers are known in advance -- so it
  # costs seconds and runs before anything is built.
  #
  # **The corpus is nightly; the harness is not.** `parity.sh` over
  # `tests/cases` is hours and lives in `nightly.yml`. But a change that broke
  # `parity.sh`'s ability to tell a divergence from agreement would survive
  # until a nightly whose divergence list was empty for the wrong reason, and an
  # empty list is exactly what criterion 5 reads as success. So the gate's own
  # machinery is checked where a change to it is made.
  harness:
    name: harness selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: parity.sh reports what happened
        run: tests/harness/selftest.sh
      - name: soak-report.sh answers criterion 1
        run: scripts/soak-report-selftest.sh

  test-debian:
    # glibc 2.41 leaves an outer native frame pointer that is not a readable
    # frame chain. Keep this separate from Ubuntu to cover that boundary.
    name: test (Debian 13 / glibc 2.41)
    runs-on: ubuntu-latest
    container: rust:1.95.0-trixie
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            target
          key: cargo-test-debian13-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-test-debian13-
      - name: Versions
        run: |
          rustc --version
          ldd --version
      - name: Build for the test suite
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked

  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # **Both platforms, because a `cfg` is invisible to the other one.**
      # `sys/windows.rs` is not compiled on Linux, so nothing Linux runs has an
      # opinion about it -- a dead function or a needless cast there fails the
      # build only where it is built. That is not hypothetical: the arm that
      # crosses the Rust frames with the unwind tables left
      # `current_frame_pointer` unused on Windows and nowhere else.
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Restore cargo and target caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-lint-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-lint-${{ matrix.os }}-

      # Once only. `rustfmt` parses rather than compiles, so it formats the
      # arms this platform does not build and answers the same on both --
      # running it twice would only be a second way to spend a runner.
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # `--all-targets` so tests and examples are linted too, and `-D warnings`
      # so a lint that is only a warning locally still fails the build. No
      # `CC` and no MSVC environment: clippy checks, and checking does not link.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
