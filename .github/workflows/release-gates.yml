# The v1.0 release gates that are CI jobs rather than test-suite passes.
#
# Separate from `ci.yml` on purpose. `ci.yml` answers "does this change work";
# this file answers "is this repository still in a state the release criteria
# describe", which is a different question with a different owner and a
# different failure meaning. Keeping them apart also keeps a release gate from
# being lost inside a 45-minute matrix.
#
# Each job below names the criterion it implements in RELEASE-CRITERIA-1.0.md.
# A job with no criterion does not belong here.

name: Release gates

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` and `unlabeled` are what make the change-label job re-run when
    # somebody adds the label it asked for. Without them the contributor fixes
    # the thing and the check stays red until an unrelated push.
    types: [opened, reopened, synchronize, labeled, unlabeled]

  # Criterion 7 verifies a *published* release, so it is run on request against
  # a version that exists rather than on every pull request against the last one.
  workflow_dispatch:
    inputs:
      version:
        description: "W# version to verify, without a leading v (e.g. 0.2.3)"
        required: true
        type: string
      sharpie_version:
        description: "sharpie version to verify, or empty to skip (e.g. 0.1.2)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  # Criterion 0, on the document that lists every other gate.
  #
  # RELEASE-CRITERIA-1.0.md's "The state of the checks" table is what anybody
  # reads to decide what is still owed before v1.0, and it claims which files
  # exist. Revision 2 of it was accurate when published and wrong on six of ten
  # rows twenty minutes later, because three pull requests landed behind it --
  # every wrong row being either work somebody would redo or work nobody would
  # pick up. Care does not fix that; a check does.
  #
  # Cheap enough to run first and on everything: no toolchain, no cache, a few
  # seconds of `test -e`. It is the same trick the `doc-examples` job plays on
  # the prose, aimed at the table instead.
  gate-table:
    name: gate state table (criterion 0)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The check's own tests, before the check: a gate whose logic is
      # unverified can pass everything and be believed. The last case in this
      # file is the real document against the real tree, so a failure reading
      # "the table drifted" is distinguishable from one reading "the check
      # broke".
      - name: Test the checker
        run: bash scripts/tests/gate-table-check.test.sh

      - name: Hold the state table to the tree
        run: bash scripts/gate-table-check.sh

  # Criterion 4. Every tracked limitation is closed as fixed, or closed with the
  # `v1.0-limitation` label and an entry in `LIMITATIONS.md`.
  #
  # The only gate here whose data is not in this tree: whether an issue is open
  # is a question for GitHub. So this is the one job that can fail for a reason
  # saying nothing about the criterion -- a rate limit, a dropped connection --
  # and `followups-check.sh` exits 2 rather than 0 on every one of them. The
  # token is what keeps it off the sixty-an-hour anonymous limit that a runner's
  # address shares with every other job on it.
  #
  # `issues: read` rather than the file's default of `contents: read` alone: the
  # issues are public, but a token narrowed to `contents` is refused when it is
  # sent, and that refusal would read as a rate limit.
  followups:
    name: limitations resolved or documented (criterion 4)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4

      # The check's own tests, before the check. Most of them drive a stubbed
      # fetcher, because "the gate went green because it could not ask" is the
      # one failure mode a green CI run will never show anybody.
      - name: Test the checker
        run: bash scripts/tests/followups-check.test.sh </dev/null
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Not on a pull request. Its answer is about issue state, not about the
      # change under review, and a limitation labelled somewhere else would
      # otherwise turn every open pull request red until it was documented.
      # On `main` and on request it runs, and a red there is the gate's answer.
      - name: Hold every tracked limitation to one of its two allowed states
        if: github.event_name != 'pull_request'
        run: bash scripts/followups-check.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Criterion 3. Asks GitHub which defects closed in the freeze window and what
  # closed them, so -- like `followups` -- it exits 2 rather than 0 when it
  # cannot ask. The window starts at `.github/freeze-start`; until Day 0 is
  # declared there is no window, so only the checker's own tests run.
  guards:
    name: every fix carries a guard (criterion 3)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The freeze-start commit's date is read from history.
          fetch-depth: 0

      - name: Test the checker
        run: bash scripts/tests/guard-check.test.sh </dev/null

      - name: Every defect fixed in the window carries a guard
        if: github.event_name != 'pull_request' && hashFiles('.github/freeze-start') != ''
        run: bash scripts/guard-check.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Criterion 2's mechanism. Every pull request carries exactly one of
  # `change:breaking`, `change:additive`, `change:fix`, `change:none`.
  #
  # This must be enforced from before day 0: the criterion asks "were any merges
  # to `main` in that window labelled `change:breaking`", and a window whose
  # merges were not labelled cannot be answered after the fact.
  change-label:
    name: change label (criterion 2)
    # Only a pull request has labels. On a push to `main` there is nothing to
    # check -- the label was checked on the way in, which is the point.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The rule's own tests. A gate whose logic is unverified can pass
      # everything and be believed, so the logic is checked before it is used.
      - name: Test the rule
        run: bash scripts/tests/check-change-label.test.sh

      # Read the labels out of the event payload rather than calling the API:
      # no token, no rate limit, and the payload is what triggered this run, so
      # a `labeled` event cannot race a separate read.
      - name: Check this pull request's labels
        run: jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" | bash scripts/check-change-label.sh

  # Gate 6a. Every documented example is a real file, executed in CI.
  #
  # Red today: eight complete programs in `README.md` and `docs/processes.md`
  # carry no marker, so nothing checks them against anything. The script names
  # each one. Marking them up is prose work and belongs to whoever owns the
  # prose; this job is what stops the count growing.
  doc-examples:
    name: documented examples (gate 6a)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test the checker
        run: bash scripts/tests/check-doc-examples.test.sh
      - name: Check the documentation against the files it cites
        run: bash scripts/check-doc-examples.sh

  # The other half of gate 6a: `examples/` has to actually be executed, or a
  # marker naming a file in it vouches for nothing. Until this job existed
  # nothing ran `examples/*.ws` at all -- not the case suite, which reads
  # `tests/cases`, and not CI.
  #
  # Non-recursive on purpose: `examples/modules/` holds modules that other
  # examples import, and a module with no `main` is not a program to run. That
  # is the same split `tests/cases/modules/` has.
  examples:
    name: examples run (gate 6a)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore cargo and target caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-examples-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-examples-

      # `--workspace`, not just the CLI: `wsharp build` links against
      # `libwsharp_start.a`, which `cargo build -p wsharp-cli` does not produce.
      - name: Build
        run: cargo build --workspace --locked

      - name: Run every example
        run: |
          set -u
          failed=0
          for f in examples/*.ws; do
            if out="$(./target/debug/wsharp run "$f" 2>&1)"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              echo "$out" | head -20 | sed 's/^/       /'
              failed=$((failed + 1))
            fi
          done
          echo
          if [ "$failed" -ne 0 ]; then
            echo "$failed example(s) failed"
            exit 1
          fi
          echo "every example ran"

  # Gate 6d. Every command the repository tells a contributor to run works.
  #
  # The three commands are `CLAUDE.md`'s, verbatim, in its order -- the build
  # before the test because the case suite's AOT pass links against an archive
  # `cargo test` does not build. The third is issue #8 and fails today; this job
  # is what turns that from an afternoon lost per contributor into a red check
  # with an owner.
  #
  # No `nix-shell` wrapper: `CLAUDE.md` uses it because a bare NixOS box has no
  # `cc`, and the GitHub runner has one already. The commands inside are what
  # this gate is about.
  contributor-commands:
    name: contributor commands (gate 6d)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore cargo and target caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-gate6d-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-gate6d-

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace
        run: cargo test --workspace

      # The filtered build. `wsharp-start` declares `test = false` because it
      # defines `main` and a test harness brings its own; a filter that reaches
      # it anyway is #8. `--no-run` because the gate is about the command
      # working, and the unfiltered run above already ran the tests.
      - name: cargo test --workspace arithmetic --no-run
        run: cargo test --workspace arithmetic --no-run

  # Criterion 7's four rows. One job per release triple, so no platform is ever
  # claimed by inference from another platform's run -- which is what the
  # criterion's evidence clause forbids, and the reason this is a matrix of four
  # real machines rather than one machine and an argument.
  #
  # A hosted runner is a fresh VM image per job, which is the "fresh VM" half of
  # the criterion; Linux additionally runs inside a `debian:13` container with
  # nothing installed, because that is the closest thing here to a machine with
  # no developer environment at all, and it is the platform where a clean image
  # is cheap to get.
  #
  # Manual, with the version as an input: the gate is about a *published*
  # release, so there is nothing to verify until one exists, and a job that ran
  # on every pull request would be verifying the last release over and over.
  verify-install:
    name: clean install (criterion 7, ${{ matrix.triple }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One platform's failure must not hide the other three; the evidence is a
      # four-row table and a cancelled job is not a row.
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: debian:13
          - triple: x86_64-pc-windows-msvc
            os: windows-latest
            container: ""
          - triple: x86_64-apple-darwin
            os: macos-15-intel
            container: ""
          - triple: aarch64-apple-darwin
            os: macos-latest
            container: ""
    container: ${{ matrix.container || null }}
    defaults:
      run:
        shell: bash
    steps:
      # The Debian container has neither, and the script needs both. Installed
      # before the checkout because `actions/checkout` wants git.
      - name: Give the clean image curl, tar and a C compiler
        if: matrix.container != ''
        run: |
          apt-get update -qq
          # gcc because `wsharp build` links with cc -- a documented prerequisite
          # of the install rather than a convenience for this job.
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl tar gzip git gcc libc6-dev
          ln -sf "$(command -v gcc)" /usr/local/bin/cc

      - uses: actions/checkout@v4

      - name: Verify the W# install
        run: bash scripts/verify-install.sh "${{ inputs.version }}" "${{ matrix.triple }}"

      - name: Verify the sharpie install
        if: inputs.sharpie_version != ''
        run: bash scripts/verify-install.sh "${{ inputs.sharpie_version }}" "${{ matrix.triple }}" --tool sharpie
