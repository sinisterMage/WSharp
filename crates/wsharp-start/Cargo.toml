[package]
name = "wsharp-start"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# A static archive, because this is what `wsharp build` hands to `cc`. Building
# it as a staticlib is also what bundles `wsharp-runtime` into the same `.a`,
# so a compiled program links against one file rather than a list.
[lib]
crate-type = ["staticlib"]
# No test harness. This crate *defines* `main`, and a test binary brings its
# own -- building one asks the linker to place two, which it refuses. There is
# nothing here to unit-test in any case: what this archive does is checked by
# building a program with it, which `wsharp-cli`'s case suite does.
#
# **This key is not on its own enough**, which is #8: cargo applies it only
# while the lib target is not explicitly selected, and a test-name filter
# selects it. `src/lib.rs` carries `#![cfg(not(test))]` for that reason. This
# stays because it is what keeps the crate out of the graph for the ordinary
# command, and because it is the line somebody reads first.
test = false
doctest = false

[dependencies]
wsharp-runtime.workspace = true
