# Publishing a tagged release.
#
# Triggered by a tag rather than a branch, so cutting a release is `git tag
# v0.1.0 && git push --tags` and nothing else. The tag is what names the
# artifact and what the release is attached to.
#
# Nothing here runs on ordinary pushes; `ci.yml` covers those.

name: Release

on:
  push:
    tags:
      # `v0.1.0`, and `v0.1.0-rc1` for a pre-release. Anything without the `v`
      # is left alone, so a tag can still be used for something else.
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: release
    runs-on: docker
    container:
    # Pinned by digest, not by tag. The runner pulls only when it has no image
    # of that name (`forcePull=false`), so a rebuilt `:rust-1.95` would leave it
    # running the old one for ever -- which is exactly how a job ends up missing
    # a tool the image was rebuilt to add. A digest it does not have is a digest
    # it must fetch. `.forgejo/ci-image/push.sh` prints the line to paste here.
      image: forgejo-hagc.srv1954822.hstgr.cloud/ofekbickel/wsharp-ci@sha256:2f59df0512bbe01d776e35e0a269a27c57805b4dd5026e3ac5d5980ba490187c
    steps:
      - uses: actions/checkout@v4

      # A tag that cannot pass its own tests is not a release. This repeats
      # what CI already did for the commit, which is the point: a tag can be
      # pushed at any commit, including one CI never saw.
      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked

      # The standard library is `include_str!`'d into the binary
      # (`wsharp-runtime/src/builtins.rs`), so the archive needs no `std`
      # directory beside it -- one executable is a complete installation.
      - name: Package
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          stage="wsharp-${version}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/release/${stage}"
          cp target/release/wsharp README.md LICENSE "dist/release/${stage}/"
          tar -czf "dist/release/${stage}.tar.gz" -C dist/release "${stage}"
          rm -r "dist/release/${stage}"
          cd dist/release
          sha256sum ./*.tar.gz > SHA256SUMS
          ls -l
          cat SHA256SUMS

      # Creates the release at this tag and uploads everything in `release-dir`.
      # `forge.token` is minted for this job by Forgejo itself, so there is no
      # secret to configure; it carries the `write:repository` this needs.
      - name: Publish
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          release-dir: dist/release
          # `v0.1.0-rc1` is a pre-release, `v0.1.0` is not: the hyphen is what
          # semver already uses to say so.
          prerelease: ${{ contains(github.ref_name, '-') }}
