# Continuous integration for W#.
#
# Forgejo reads workflows from `.forgejo/workflows` (and, for compatibility,
# `.github/workflows`); the Forgejo-native directory is used here so nothing
# implies this repository is mirrored to GitHub.
#
# `runs-on: docker` is the label `forgejo-runner register` offers by default.
# A runner registered with different labels needs this changed to match, since
# a job whose label no runner claims waits forever rather than failing.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A backtrace costs nothing until something panics, and when something does
  # panic in CI the log is all there is to debug from.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test
    runs-on: docker
    # Pinned to the toolchain `rust-toolchain.toml` asks for, so rustup has
    # nothing to download. The bookworm image (not `-slim`, not `-alpine`)
    # matters: rustc shells out to `cc` to link, and an image without one
    # reproduces exactly the "linker `cc` not found" failure that CLAUDE.md
    # warns about -- library crates compile and then tests fail to link.
    container:
      image: rust:1.95-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Restore cargo and target caches
        uses: actions/cache@v4
        # A runner started without its cache server has no ACTIONS_CACHE_URL,
        # and this action errors out when it cannot find one. That is a runner
        # configuration detail, not a fault in the code under test, so it must
        # not turn the build red.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # `target` holds artifacts built with one profile by one toolchain;
          # keying on the job as well as the lockfile keeps `test` and `lint`
          # from overwriting each other's cache on every run.
          key: cargo-test-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-test-

      - name: Versions
        run: |
          rustc --version
          cargo --version
          cc --version | head -1

      # Runs the end-to-end case suite twice -- once normally and once under
      # `--gc-stress`, which collects at every allocation and checks every root
      # the stack maps describe. That second pass is the collector's main
      # defence, so it is the reason CI runs the whole workspace rather than
      # only the unit tests.
      - name: Test
        run: cargo test --workspace --locked

  lint:
    name: lint
    runs-on: docker
    container:
      image: rust:1.95-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Restore cargo and target caches
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-lint-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-lint-

      - name: Formatting
        run: cargo fmt --all -- --check

      # `--all-targets` so tests and examples are linted too, and `-D warnings`
      # so a lint that is only a warning locally still fails the build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
