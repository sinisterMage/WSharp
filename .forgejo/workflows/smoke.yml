# Does W# build and pass its tests on the macOS and Windows runners?
#
# These runners execute on the host, not in a container, so nothing here can
# lean on the CI image the way `ci.yml` does -- whatever the machine has is
# what the job gets. The tool probes below are separate steps on purpose: a
# missing rustc and a missing node are very different problems, and reading
# which step went red says which it is without opening a log.
#
# Each probe is `continue-on-error` so one absent tool does not hide the rest,
# and every `run:` here is a bare command with no pipes, `&&` or redirection,
# because the default shell differs between these two machines.
#
# Runs when this file changes, or on demand.

name: Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".forgejo/workflows/smoke.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos:
    name: macos-arm64
    runs-on: macos-arm64
    timeout-minutes: 30
    steps:
      - name: Probe rustc
        continue-on-error: true
        run: rustc --version
      - name: Probe cargo
        continue-on-error: true
        run: cargo --version
      - name: Probe node
        continue-on-error: true
        run: node --version
      - name: Probe git
        continue-on-error: true
        run: git --version
      - name: Probe cc
        continue-on-error: true
        run: cc --version

      - uses: actions/checkout@v4

      # The real question: `rust-toolchain.toml` pins 1.95, so this also shows
      # whether rustup is present to honour it.
      - name: Test
        run: cargo test --workspace --locked

  windows:
    name: windows-amd64
    runs-on: windows
    # Every `run:` step failed with "running scripts is disabled on this
    # system": the runner writes each one to a .ps1 and PowerShell's execution
    # policy refuses to load it. cmd has no such policy, and these commands are
    # bare enough not to care which shell runs them. The alternative is
    # `Set-ExecutionPolicy RemoteSigned` on the machine, which is the better fix
    # if a step ever needs a real shell -- packaging a release will.
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    steps:
      - name: Probe rustc
        continue-on-error: true
        run: rustc --version
      - name: Probe cargo
        continue-on-error: true
        run: cargo --version
      - name: Probe node
        continue-on-error: true
        run: node --version
      - name: Probe git
        continue-on-error: true
        run: git --version
      # No `cc` probe: MSVC links through link.exe, so the build is the only
      # honest test of whether a linker is reachable.

      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --workspace --locked

      # The most direct question there is: does one generated program run?
      # `continue-on-error` so the suite below still gets its turn, and a
      # timeout because a crashing process on Windows can sit at an error
      # dialog for ever instead of exiting.
      - name: Run one example directly
        continue-on-error: true
        timeout-minutes: 3
        run: cargo run --locked --bin wsharp -- run examples/fib.ws

      # `every_case_*` are the two that hung: each runs the compiler over every
      # file in tests/cases and waits on it with no timeout of its own. Skipped
      # until the crash below is understood, so this job ends.
      #
      # `--nocapture` is the point of the exercise: cargo prints a failing
      # test's output only after the whole binary finishes, so cancelling a run
      # that hangs takes the one error message worth having with it.
      - name: Test, minus the cases that hang
        timeout-minutes: 15
        run: cargo test --workspace --locked -- --nocapture --test-threads=1 --skip every_case_
