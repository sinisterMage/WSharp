# Does W# build and pass its tests on the macOS and Windows runners?
#
# These runners execute on the host, not in a container, so nothing here can
# lean on the CI image the way `ci.yml` does -- whatever the machine has is
# what the job gets. The tool probes below are separate steps on purpose: a
# missing rustc and a missing node are very different problems, and reading
# which step went red says which it is without opening a log.
#
# Each probe is `continue-on-error` so one absent tool does not hide the rest,
# and every `run:` here is a bare command with no pipes, `&&` or redirection,
# because the default shell differs between these two machines.
#
# Runs when this file changes, when a platform arm does, or on demand.
#
# The path filter is the point rather than a saving. `crates/wsharp-runtime/src/sys/`
# is three hand-written bindings to three operating systems, and only one of them
# can be run on the machine the work is done on -- the other two are checked with
# `cargo check --target` and believed. These runners are where they are actually
# executed, so a change to one has to reach them.

name: Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".forgejo/workflows/smoke.yml"
      - "crates/wsharp-runtime/src/sys/**"
      - "crates/wsharp-runtime/src/net.rs"
      - "crates/wsharp-runtime/src/io.rs"
      - "crates/wsharp-runtime/src/worker.rs"
      - "crates/wsharp-runtime/src/stackwalk.rs"
      - "crates/wsharp-runtime/src/std/**"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos:
    name: macos-arm64
    runs-on: macos-arm64
    timeout-minutes: 30
    steps:
      - name: Probe rustc
        continue-on-error: true
        run: rustc --version
      - name: Probe cargo
        continue-on-error: true
        run: cargo --version
      - name: Probe node
        continue-on-error: true
        run: node --version
      - name: Probe git
        continue-on-error: true
        run: git --version
      - name: Probe cc
        continue-on-error: true
        run: cc --version

      - uses: actions/checkout@v4

      # The BSD arm: `sys/bsd.rs` is the only binding here that this project's
      # own machine cannot run at all. Kept as its own step so a regression says
      # which half broke rather than that some test failed.
      - name: The sockets and the syscalls under them
        timeout-minutes: 10
        run: cargo test --workspace --locked sys

      # The real question: `rust-toolchain.toml` pins 1.95, so this also shows
      # whether rustup is present to honour it.
      - name: Test
        run: cargo test --workspace --locked

  windows:
    name: windows-amd64
    runs-on: windows
    timeout-minutes: 30
    steps:
      - name: Probe rustc
        continue-on-error: true
        run: rustc --version
      - name: Probe cargo
        continue-on-error: true
        run: cargo --version
      - name: Probe node
        continue-on-error: true
        run: node --version
      - name: Probe git
        continue-on-error: true
        run: git --version

      - uses: actions/checkout@v4

      # This is the program that died with an access violation: it reaches
      # `io.read_file`, the first builtin whose result is two words wide. Kept
      # as its own step because a regression here should say which program
      # broke, not just that some test failed.
      - name: The example that crashed
        timeout-minutes: 5
        run: cargo run --locked --bin wsharp -- run examples/library.ws

      # The Windows arm: `CreateFileW`, Winsock and `WSAPoll`, none of which
      # this project's own machine can run.
      - name: The sockets and the syscalls under them
        timeout-minutes: 10
        run: cargo test --workspace --locked sys

      # No longer skipping `every_case_*`. They hung because the suite reaches
      # `tests/cases/io.ws`, the one case that calls those builtins, and a
      # Windows process that dies of an access violation can sit at a crash
      # dialog rather than exiting -- so the harness waited on it for ever.
      # These also carry the only test of the root walk on this platform: the
      # `--gc-stress` pass collects at every allocation, which is what makes
      # the collector walk the frame-pointer chain at all.
      - name: Test
        timeout-minutes: 20
        run: cargo test --workspace --locked
